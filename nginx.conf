# SPA fallback: path apa pun yang bukan berkas statis diarahkan ke index.html,
# supaya refresh di /charts atau /users/123 tidak 404 (React Router yang
# menangani routing-nya di browser).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aset hasil build punya hash di namanya, jadi aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
