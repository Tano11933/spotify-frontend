name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci memakai package-lock.json persis, bukan menyelesaikan ulang
      # rentang versi seperti npm install.
      - run: npm ci

      - run: npm run lint

      - run: npx tsc -b --force

      # Build produksi sekaligus memastikan bundle Vite benar-benar terbentuk.
      - run: npm run build
