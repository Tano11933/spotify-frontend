name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci memakai package-lock.json persis, bukan menyelesaikan ulang
      # rentang versi seperti npm install.
      - run: npm ci

      # Checkout bersih tidak punya .env (gitignored). Salin contohnya supaya
      # langkah build memakai konfigurasi yang sama seperti setup lokal; test
      # sendiri tidak bergantung pada file ini (lihat `test.env` di
      # vite.config.ts).
      - run: cp .env.example .env

      - run: npm run lint

      # Test unit cepat (beberapa detik): logika lib/schemas/store dan
      # komponen kecil, tanpa backend.
      - run: npm test

      - run: npx tsc -b --force

      # Build produksi sekaligus memastikan bundle Vite benar-benar terbentuk.
      - run: npm run build
